name: Uptime monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to save status.json back to the repo

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check websites
        run: python3 monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save status
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- status.json)" ]; then
            git config user.name "uptime-monitor"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status.json
            git commit -m "Update site status"
            git pull --rebase --quiet || true
            git push
          fi
